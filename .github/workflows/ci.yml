name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Rust lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test codecs
        run: cargo test --workspace --all-targets

  benchmark:
    name: Storage codec comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run deterministic benchmark
        run: cargo run --release -p dhtrove-bench -- 2000 | tee benchmark-results.md
      - name: Upload benchmark table
        uses: actions/upload-artifact@v4
        with:
          name: storage-codec-benchmark
          path: benchmark-results.md
          retention-days: 30
