[package]
name = "dhtrove-crawler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Headless DHT discovery, BEP 9 metadata fetch and DHTrove storage orchestration"

[dependencies]
dhtrove-dht = { path = "../dhtrove-dht" }
dhtrove-metadata = { path = "../dhtrove-metadata" }
dhtrove-storage = { path = "../dhtrove-storage" }
dhtrove-store = { path = "../dhtrove-store" }
tokio = { version = "1.42", features = ["net", "time", "rt", "sync", "macros"] }
rand = "0.8"
