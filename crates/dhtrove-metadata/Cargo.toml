[package]
name = "dhtrove-metadata"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "BEP 9/10 metadata exchange and v1/v2 torrent info parser"

[dependencies]
dhtrove-dht = { path = "../dhtrove-dht" }
dhtrove-storage = { path = "../dhtrove-storage" }
tokio = { version = "1.42", features = ["net", "time", "io-util"] }
sha1 = "0.10"
sha2 = "0.10"
